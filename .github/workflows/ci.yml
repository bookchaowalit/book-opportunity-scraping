# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
name: CI

on:
  # Gate every branch, not only main (kept from the previous workflow: feature branches
  # without a PR were otherwise untested).
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scrapers:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@c37ef9d113eefb3ed45429717cb7ca201192c3fc # v1.0.1
    with:
      python-version: "3.11" # same as the previous workflow
      # `ruff format` would rewrite 17 of 24 files (~3,100 changed lines). That reformat is a
      # separate follow-up so it can be reviewed on its own; `ruff check` (ruff.toml) still runs.
      format-check: false
      # Tests: `auto` = pytest (installed by the workflow; requirements.txt holds runtime deps only).
      # Offline only (fixtures, no live site traffic), as before.

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@c37ef9d113eefb3ed45429717cb7ca201192c3fc # v1.0.1
