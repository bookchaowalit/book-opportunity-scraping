target-version = "py310"
extend-exclude = ["data"]

[lint]
# Pin the rule set so newer ruff releases with wider defaults do not break CI.
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Runner scripts and tests put the repository root on sys.path first.
"scripts/*" = ["E402"]
"tests/*" = ["E402"]
